name: Release (firmware + Linux x86_64)

# Builds T-Deck / T-Deck MAX firmware and Linux x86_64 desktop packages in a single runner job from
# the tagged commit and the pinned public MeshCore submodule (zero intermediate artifacts, one shared
# PlatformIO cache across all versions), packages them with scripts/package_release.sh, and attaches
# them to a DRAFT GitHub release for the tag. Publish the draft by hand after checking it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FARO_EDITION_MARKERS: ${{ secrets.FARO_EDITION_MARKERS }}   # private marker list (check-edition.py)
  MESHCORE_URL: https://github.com/meshcore-dev/MeshCore.git
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  gates:
    if: github.repository == 'radeksixi/sixi-tdeck-plus'   # public repository only
    name: Edition and licence gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches the version scheme
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>"; exit 1; }
      - name: Submodule is the public MeshCore upstream, pinned
        run: |
          url="$(git config -f .gitmodules submodule.external/MeshCore.url)"
          [ "$url" = "$MESHCORE_URL" ] || { echo "::error::external/MeshCore must point to $MESHCORE_URL (is: $url)"; exit 1; }
          git ls-tree HEAD external/MeshCore | grep -q '^160000 commit ' \
            || { echo "::error::external/MeshCore has no pinned gitlink"; exit 1; }
      - run: python3 scripts/check-edition.py --self-test
      - name: check-edition (tree + full git history)
        env:
          FARO_EDITION_MARKERS: ${{ secrets.FARO_EDITION_MARKERS }}
          FARO_EDITION_EXTRA_MARKERS: ${{ secrets.FARO_EDITION_EXTRA_MARKERS }}
        run: python3 scripts/check-edition.py .
      - run: scripts/license_audit.sh

  release:
    if: github.repository == 'radeksixi/sixi-tdeck-plus'   # public repository only
    name: Build, package and upload draft release
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: true
      - name: Submodule and dependency cache key
        id: sub
        run: |
          url="$(git -C external/MeshCore remote get-url origin)"
          [ "$url" = "$MESHCORE_URL" ] || { echo "::error::external/MeshCore was cloned from $url"; exit 1; }
          echo "sha=$(git -C external/MeshCore rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          deps="$(sed 's/;.*$//' envs/faro.ini | grep -E '@|https?://' | sort -u | sha256sum | cut -c1-12)"
          echo "deps=${deps}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Cache PlatformIO packages and libraries (shared T-Deck toolchain)
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            external/MeshCore/.pio/libdeps
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-tdeck-${{ steps.sub.outputs.sha }}-${{ steps.sub.outputs.deps }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-tdeck-${{ steps.sub.outputs.sha }}-
            pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-tdeck-
      - name: Install desktop build tools and PlatformIO
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libpng-dev unifdef
          pip install "platformio==${PLATFORMIO_VERSION}"
      - name: Build and test Linux x86_64 desktop binaries
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_FLAGS=-Wall -Wextra" "-DCMAKE_CXX_FLAGS=-Wall -Wextra"
          cmake --build build
          ctest --test-dir build --output-on-failure
          python3 scripts/check-edition.py --no-history build/faro-sim build/faro-console
      - name: Build and audit T-Deck / T-Deck MAX firmware
        run: |
          scripts/link_env.sh
          for env in faro_tdeck faro_tdeck_max; do
            pio run -d external/MeshCore -e "$env"
            FARO_AUDIT_ENVS="$env" scripts/license_audit.sh
            B="external/MeshCore/.pio/build/$env"
            python3 scripts/check-edition.py --no-history "$B/firmware.bin" "$B/firmware.elf"
          done
      - name: Package release assets
        run: scripts/package_release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --verify-tag \
            --title "Faro ${GITHUB_REF_NAME}" \
            --notes "Built by CI from ${GITHUB_SHA}. Verify downloads with: sha256sum -c SHA256SUMS. Licences: NOTICE, THIRD_PARTY.md; full texts in LICENSES/ inside each archive."
